version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  # The server SDKs (Jellyfin.Controller, MediaBrowser.Server.Core) define
  # which servers the plugins load on: bump them deliberately, never by bot.
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: monthly }
    ignore:
      - dependency-name: "Jellyfin.*"
      - dependency-name: "MediaBrowser.*"
      # Compiled against, never shipped: the servers provide it, and Emby runs on
      # .NET 8. A newer major makes the Emby plugin unloadable.
      - dependency-name: "System.Text.Json"
        update-types: ["version-update:semver-major"]
