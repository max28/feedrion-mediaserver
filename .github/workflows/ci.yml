name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # GitHub-hosted by default. A private fork may point CI_RUNS_ON at its own
    # runner labels (JSON, e.g. ["self-hosted","linux"]); never do that on a
    # PUBLIC repository — a pull request from anyone would run on it.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Feedrion.MediaServer.slnx
      - run: dotnet build Feedrion.MediaServer.slnx -c Release --no-restore -nologo
      - run: dotnet test tests/Feedrion.MediaServer.Core.Tests -c Release --no-build -nologo
      - name: Package (dry run)
        run: |
          dotnet publish src/Jellyfin.Plugin.Feedrion -c Release -o publish/jellyfin --no-build -nologo
          dotnet publish src/Emby.Plugin.Feedrion -c Release -o publish/emby --no-build -nologo
          python3 scripts/package.py --version 0.0.0 --out artifacts \
            --jellyfin publish/jellyfin --emby publish/emby \
            --repo-url "${{ github.server_url }}/${{ github.repository }}"
