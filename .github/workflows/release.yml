name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (X.Y.Z)"
        required: true
      changelog:
        description: "One line for the Jellyfin catalogue"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    permissions:
      contents: write   # the GitHub release
      id-token: write   # keyless cosign signature
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Feedrion.MediaServer.slnx
      - run: dotnet build Feedrion.MediaServer.slnx -c Release --no-restore -nologo -p:Version="$VERSION"
      - run: dotnet test tests/Feedrion.MediaServer.Core.Tests -c Release --no-build -nologo
      - name: Package
        env:
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          dotnet publish src/Jellyfin.Plugin.Feedrion -c Release -o publish/jellyfin --no-build -nologo -p:Version="$VERSION"
          dotnet publish src/Emby.Plugin.Feedrion -c Release -o publish/emby --no-build -nologo -p:Version="$VERSION"
          python3 scripts/package.py --version "$VERSION" --out artifacts \
            --jellyfin publish/jellyfin --emby publish/emby \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --changelog "$CHANGELOG"
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        run: |
          for f in artifacts/*.zip artifacts/SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" artifacts/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Feedrion for Jellyfin & Emby $VERSION" \
            --notes "See README for installation. Signatures: cosign keyless (*.sigstore.json)."
